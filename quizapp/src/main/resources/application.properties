spring.application.name=quizapp

# MySQL - create the database first:  CREATE DATABASE quizapp;
spring.datasource.url=jdbc:mysql://localhost:3306/quizapp?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# "update" keeps the questions between restarts ("create" wiped them every time)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8093
